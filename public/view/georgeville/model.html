<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Georgeville Pump Station | The Masonry Modeler</title>
<style>
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#f0eee8; --text:#1d1c19; --muted:#6b6860;
  --border:#dedbd2; --accent:#b4531f; --accent-soft:#f6e3d6; --scene:#e9e7e1; --grid:#c9c5ba;
  --shadow:0 6px 24px rgba(30,25,15,.14); --hl:#e8a33a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --surface:#202227; --surface-2:#2a2d33; --text:#ecebe7; --muted:#a3a19a;
    --border:#373a41; --accent:#f08a4b; --accent-soft:#3a2a20; --scene:#1b1c20; --grid:#3a3d44;
    --shadow:0 6px 24px rgba(0,0,0,.5); --hl:#ffb347;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --surface:#202227; --surface-2:#2a2d33; --text:#ecebe7; --muted:#a3a19a;
  --border:#373a41; --accent:#f08a4b; --accent-soft:#3a2a20; --scene:#1b1c20; --grid:#3a3d44;
  --shadow:0 6px 24px rgba(0,0,0,.5); --hl:#ffb347;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
header h1{font-size:15px;margin:0;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{color:var(--muted);font-weight:400}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:8px;
  padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;min-height:34px}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
#scene{position:fixed;left:0;right:0;bottom:0;top:var(--hdr,51px);touch-action:none}
#scene canvas{display:block;width:100%;height:100%}
#status{position:fixed;left:16px;bottom:16px;z-index:3;color:var(--muted);font-size:12px;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:4px 8px;max-width:calc(100% - 32px)}
#layers{position:fixed;z-index:6;top:calc(var(--hdr,51px) + 8px);right:16px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;display:none;min-width:200px}
#layers.open{display:block}
#layers h3{margin:0 0 6px;font-size:13px}
#layers label{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
#layers .sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--border);flex:none}
#layers .n{margin-left:auto;color:var(--muted);font-size:12px}
#panel{position:fixed;z-index:4;top:calc(var(--hdr,51px) + 8px);right:16px;bottom:16px;width:min(440px,calc(100% - 32px));
  background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);display:none;flex-direction:column}
#panel.open{display:flex}
#panel .ph{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--border)}
#panel .ph h2{font-size:15px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
#panel .ph .sub{color:var(--muted);font-size:12px;font-weight:400;display:block;margin-top:2px}
#panel .pb{overflow:auto;padding:4px 14px 16px;-webkit-overflow-scrolling:touch}
.x{appearance:none;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px}
section h3{font-size:13px;margin:16px 0 6px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:fit-content(58%) minmax(0,1fr);gap:3px 12px;font-size:13px}
.kv dd.n{white-space:nowrap}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#sheetBlock{border:1px solid var(--hl);border-radius:10px;padding:6px 10px;margin-top:10px;background:var(--surface-2)}
#sheetBlock h4{margin:0 0 4px;font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:5px 7px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th{background:var(--surface-2);font-weight:600;vertical-align:bottom;white-space:normal;min-width:56px}
th small{display:block;font-weight:400;color:var(--muted)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th:first-child{background:var(--surface-2)}
tr.tot td{font-weight:700;border-bottom:0}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.warn{font-size:12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;margin:10px 0}
details{margin-top:14px} summary{cursor:pointer;font-weight:600;font-size:13px}
#card{position:fixed;z-index:5;left:16px;bottom:16px;width:min(320px,calc(100% - 32px));background:var(--surface);border:1px solid var(--border);
  border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;display:none}
#card.open{display:block}
#card h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
#card h4 span{flex:1;min-width:0;overflow-wrap:anywhere}
.chip{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--border);vertical-align:-2px;margin-right:4px}
@media (max-width:720px){
  header{padding:6px 16px} header h1{font-size:14px;flex-basis:100%}
  /* the phone viewer's own close/menu buttons sit over the top of the page: keep the tools at the bottom */
  .tools{position:fixed;left:0;right:0;bottom:0;z-index:7;justify-content:space-between;flex-wrap:nowrap;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--border)}
  #status{bottom:calc(64px + env(safe-area-inset-bottom))}
  #scene{bottom:calc(52px + env(safe-area-inset-bottom))}
  #layers{top:auto;bottom:calc(64px + env(safe-area-inset-bottom));right:16px}
  body.sheet .tools{display:none}
  .btn{padding:5px 7px;font-size:12px;min-height:36px;white-space:nowrap}
  #panel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:58vh;border-radius:14px 14px 0 0;border-left:0;border-right:0;border-bottom:0}
  #panel .ph::before{content:"";position:absolute;left:50%;top:5px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--border)}
  #panel .ph{position:relative;padding-top:14px}
  #panel .pb{padding:4px 16px 20px}
  #card{display:none!important}
  body.sheet #status{display:none}
}
</style>
</head>
<body>
<header id="hdr">
  <h1>Georgeville Arsenic Pump Station <small>· TMM IFC export</small></h1>
  <div class="tools">
    <button class="btn" id="bJob">Job totals</button>
    <button class="btn" id="bLayers">Layers</button>
    <button class="btn" id="bRebar">Rebar</button>
    <button class="btn" id="bHome">Reset view</button>
    <button class="btn" id="bTheme" title="Light / dark">◐</button>
  </div>
</header>
<div id="scene"></div>
<div id="layers"><h3>IFC layers</h3><div id="layerList"></div></div>
<div id="panel"><div class="ph"><h2 id="pTitle"></h2><button class="x" id="pClose" aria-label="Close">×</button></div><div class="pb" id="pBody"></div></div>
<div id="card"></div>
<div id="status">Loading IFC data…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
function b64buf(s){var b=atob(s.trim()),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;}

(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var hdr = $('hdr');
function sizeHdr(){ document.documentElement.style.setProperty('--hdr', hdr.offsetHeight + 'px'); }
sizeHdr();

// theme
var themeKey = 'tmm-ifc-theme';
try { var t0 = localStorage.getItem(themeKey); if (t0) document.documentElement.setAttribute('data-theme', t0); } catch(e) {}
function isDark(){
  var a = document.documentElement.getAttribute('data-theme');
  if (a) return a === 'dark';
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
}
$('bTheme').onclick = function(){
  var nt = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nt);
  try { localStorage.setItem(themeKey, nt); } catch(e) {}
  applySceneTheme();
};

var meta, N, F, U, wallOf, psetOf, colOf, layerOf, nameOf;
var scene, camera, renderer, controls, meshes = {}, openMesh = null, rebarLines = null, grid = null;
var instIndex = {};       // layer -> array of global block indices
var baseCol = null;       // Float32 r,g,b per block
var selWall = -1, selBlock = -1, ctr = [0,0,0], home = null, polyMeshes = [], polySet = {};

Promise.all([
  fetch('meta.json').then(function(r){ return r.json(); }),
  fetch('blocks.b64.txt').then(function(r){ return r.text(); }).then(b64buf),
  fetch('rebar.b64.txt').then(function(r){ return r.text(); }).then(b64buf)
]).then(function(res){ meta = res[0]; init(res[1], res[2]); })
  .catch(function(e){ $('status').textContent = 'Could not load the data: ' + e; });

function init(bbuf, rbuf){
  N = meta.nBlocks;
  F = new Float32Array(bbuf, 0, N * 7);
  U = new Uint16Array(bbuf, N * 28, N * 5);
  var bb = [1e9,1e9,1e9,-1e9,-1e9,-1e9];
  for (var i = 0; i < N; i++){
    for (var k = 0; k < 3; k++){ var v = F[i*7+k]; if (v < bb[k]) bb[k] = v; if (v > bb[k+3]) bb[k+3] = v; }
  }
  ctr = [(bb[0]+bb[3])/2, (bb[1]+bb[4])/2, bb[2]];
  var span = Math.max(bb[3]-bb[0], bb[4]-bb[1]);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, 1, 0.05, span * 20);
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  $('scene').appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.12; controls.screenSpacePanning = true;
  controls.maxPolarAngle = Math.PI * 0.495;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 0.75));
  var sun = new THREE.DirectionalLight(0xffffff, 0.65); sun.position.set(0.6, 1, 0.35); scene.add(sun);
  var sun2 = new THREE.DirectionalLight(0xffffff, 0.2); sun2.position.set(-0.7, 0.4, -0.5); scene.add(sun2);
  grid = new THREE.GridHelper(Math.ceil(span * 1.4 / 3.048) * 3.048, Math.ceil(span * 1.4 / 3.048), 0x999999, 0x999999);
  grid.material.transparent = true; grid.material.opacity = 0.35; grid.position.y = -0.005; scene.add(grid);

  (meta.polys || []).forEach(function(pp){ polySet[pp.i] = 1; });
  // per-block colours (IFC surface style colour), tiny jitter so joints read
  baseCol = new Float32Array(N * 3);
  for (i = 0; i < N; i++){
    var c = meta.colours[U[i*5]]; var j = 1 + (((i * 2654435761) >>> 0) % 1000 / 1000 - 0.5) * 0.05;
    baseCol[i*3] = Math.min(1, c[0]*j); baseCol[i*3+1] = Math.min(1, c[1]*j); baseCol[i*3+2] = Math.min(1, c[2]*j);
    var L = U[i*5+4]; if (!polySet[i]) (instIndex[L] = instIndex[L] || []).push(i);
  }
  var geo = new THREE.BoxGeometry(1, 1, 1);
  var m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3(), up = new THREE.Vector3(0,1,0);
  Object.keys(instIndex).forEach(function(L){
    var idx = instIndex[L];
    var mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    var mesh = new THREE.InstancedMesh(geo, mat, idx.length);
    for (var n = 0; n < idx.length; n++){
      var b = idx[n] * 7;
      p.set(F[b] - ctr[0], F[b+2] - ctr[2], -(F[b+1] - ctr[1]));
      q.setFromAxisAngle(up, F[b+6]);
      s.set(F[b+3], F[b+5], F[b+4]);
      m4.compose(p, q, s); mesh.setMatrixAt(n, m4);
    }
    mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(idx.length * 3), 3);
    mesh.userData = { layer: +L, idx: idx };
    mesh.instanceMatrix.needsUpdate = true;
    meshes[L] = mesh; scene.add(mesh);
  });

  // clipped pieces (rake / gable / sloped head): their own face polygon, extruded
  // through the wall, placed by the IFC profile frame (IFC x,y,z -> three x,z,-y).
  var toThree = new THREE.Matrix4().set(1,0,0,-ctr[0],  0,0,1,-ctr[2],  0,-1,0,ctr[1],  0,0,0,1);
  (meta.polys || []).forEach(function(pp){
    var shape = new THREE.Shape(pp.pts.map(function(q){ return new THREE.Vector2(q[0], q[1]); }));
    var g = new THREE.ExtrudeGeometry(shape, { depth: pp.d, bevelEnabled: false, steps: 1 });
    var m = pp.m, Mifc = new THREE.Matrix4().set(m[0],m[1],m[2],m[3], m[4],m[5],m[6],m[7], m[8],m[9],m[10],m[11], 0,0,0,1);
    var mesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0xffffff }));
    mesh.matrixAutoUpdate = false; mesh.matrix.multiplyMatrices(toThree, Mifc);
    mesh.userData = { gi: pp.i, layer: U[pp.i*5+4], poly: true };
    polyMeshes.push(mesh); scene.add(mesh);
  });

  // openings (IfcOpeningElement boxes, translucent)
  var op = meta.openings;
  if (op.length){
    var om = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, depthWrite: false });
    openMesh = new THREE.InstancedMesh(geo, om, op.length);
    op.forEach(function(o, n){
      p.set(o.c[0] - ctr[0], o.c[2] - ctr[2], -(o.c[1] - ctr[1])); q.setFromAxisAngle(up, o.r); s.set(o.s[0], o.s[2], o.s[1]);
      m4.compose(p, q, s); openMesh.setMatrixAt(n, m4);
      var cc = meta.colours[o.colour]; openMesh.setColorAt(n, new THREE.Color(cc[0], cc[1], cc[2]));
    });
    openMesh.userData = { layer: op[0].layer, openings: true };
    openMesh.renderOrder = 2; scene.add(openMesh);
  }

  // rebar (IfcReinforcingBar swept-disk axes as thin lines), off by default
  var segs = meta.nRebarSegs;
  if (segs){
    var rp = new Float32Array(rbuf, 0, segs * 6), pos = new Float32Array(segs * 6);
    for (i = 0; i < segs * 2; i++){
      pos[i*3] = rp[i*3] - ctr[0]; pos[i*3+1] = rp[i*3+2] - ctr[2]; pos[i*3+2] = -(rp[i*3+1] - ctr[1]);
    }
    var rg = new THREE.BufferGeometry(); rg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var rcol = rebarColour();
    rebarLines = new THREE.LineSegments(rg, new THREE.LineBasicMaterial({ color: rcol, depthTest: false, transparent: true, opacity: 0.9 }));
    rebarLines.renderOrder = 3; rebarLines.visible = false; scene.add(rebarLines);
  }

  buildLayers();
  paint();
  var dist = span * 1.05;
  home = { pos: new THREE.Vector3(dist * 0.62, dist * 0.55, dist * 0.78), target: new THREE.Vector3(0, (bb[5]-bb[2]) * 0.2, 0) };
  goHome();
  applySceneTheme();
  resize(); window.addEventListener('resize', function(){ sizeHdr(); resize(); });
  hookPicking();
  $('status').textContent = N.toLocaleString() + ' blocks · ' + meta.walls.length + ' walls · ' + meta.nBars.toLocaleString() + ' bars · tap a wall';
  (function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
  window.__tmm = { ready: true, blocks: N, sel: function(){ return selWall; },
    screenOf: function(k){ var best = -1, by = -1e9; for (var i = 0; i < N; i++) if (U[i*5+1] === k && F[i*7+2] > by){ by = F[i*7+2]; best = i; }
      var v = new THREE.Vector3(F[best*7] - ctr[0], F[best*7+2] - ctr[2], -(F[best*7+1] - ctr[1])).project(camera), r = renderer.domElement.getBoundingClientRect();
      return [r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height]; } };
}

function rebarColour(){ return 0xb03a2e; }

function goHome(){ camera.position.copy(home.pos); controls.target.copy(home.target); controls.update(); }
$('bHome').onclick = function(){ goHome(); };

function resize(){
  var el = $('scene'), w = el.clientWidth, h = el.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
function applySceneTheme(){
  if (!scene) return;
  var cs = getComputedStyle(document.documentElement);
  scene.background = new THREE.Color(cs.getPropertyValue('--scene').trim());
  grid.material.color.set(cs.getPropertyValue('--grid').trim());
}
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySceneTheme);

// colouring: selection keeps IFC colours on the picked wall, fades the rest
function paint(){
  var hl = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--hl').trim() || '#e8a33a');
  var fade = isDark() ? [0.17, 0.18, 0.2] : [0.93, 0.925, 0.91];
  Object.keys(meshes).forEach(function(L){
    var mesh = meshes[L], idx = mesh.userData.idx, a = mesh.instanceColor.array;
    for (var n = 0; n < idx.length; n++){
      var i = idx[n], r = baseCol[i*3], g = baseCol[i*3+1], b = baseCol[i*3+2];
      if (selWall >= 0){
        if (U[i*5+1] !== selWall){ r = r*0.12 + fade[0]*0.88; g = g*0.12 + fade[1]*0.88; b = b*0.12 + fade[2]*0.88; }
        else { r = r*0.7 + hl.r*0.3; g = g*0.7 + hl.g*0.3; b = b*0.7 + hl.b*0.3; }
      }
      if (i === selBlock){ r = 0.85; g = 0.25; b = 0.1; }
      a[n*3] = r; a[n*3+1] = g; a[n*3+2] = b;
    }
    mesh.instanceColor.needsUpdate = true;
  });
  polyMeshes.forEach(function(mesh){
    var i = mesh.userData.gi, r = baseCol[i*3], g = baseCol[i*3+1], b = baseCol[i*3+2];
    if (selWall >= 0){
      if (U[i*5+1] !== selWall){ r = r*0.12 + fade[0]*0.88; g = g*0.12 + fade[1]*0.88; b = b*0.12 + fade[2]*0.88; }
      else { r = r*0.7 + hl.r*0.3; g = g*0.7 + hl.g*0.3; b = b*0.7 + hl.b*0.3; }
    }
    if (i === selBlock){ r = 0.85; g = 0.25; b = 0.1; }
    mesh.material.color.setRGB(r, g, b);
  });
}

// layers
var layerOn = {};
function buildLayers(){
  var list = $('layerList'), html = '';
  meta.layers.forEach(function(name, L){
    var cnt = 0, sw = '#999';
    if (meshes[L]) { cnt = meshes[L].userData.idx.length; var c = meta.colours[U[meshes[L].userData.idx[0]*5]]; sw = rgb(c); }
    else if (openMesh && openMesh.userData.layer === L){ cnt = meta.openings.length; sw = rgb(meta.colours[meta.openings[0].colour]); }
    else if (name === 'Rebar'){ cnt = meta.nBars; sw = '#B03A2E'; }
    layerOn[L] = name !== 'Rebar';
    html += '<label><input type="checkbox" data-l="' + L + '"' + (layerOn[L] ? ' checked' : '') + '><span class="sw" style="background:' + sw + '"></span>' +
      esc(name) + '<span class="n">' + cnt.toLocaleString() + '</span></label>';
  });
  list.innerHTML = html;
  list.addEventListener('change', function(e){ var L = +e.target.getAttribute('data-l'); setLayer(L, e.target.checked); });
}
function setLayer(L, on){
  layerOn[L] = on;
  if (meshes[L]) meshes[L].visible = on;
  polyMeshes.forEach(function(mesh){ if (mesh.userData.layer === L) mesh.visible = on; });
  if (openMesh && openMesh.userData.layer === L) openMesh.visible = on;
  if (meta.layers[L] === 'Rebar'){ if (rebarLines) rebarLines.visible = on; $('bRebar').classList.toggle('on', on); }
  var cb = document.querySelector('#layerList input[data-l="' + L + '"]'); if (cb) cb.checked = on;
}
$('bLayers').onclick = function(){ $('layers').classList.toggle('open'); this.classList.toggle('on'); };
$('bRebar').onclick = function(){ var L = meta.layers.indexOf('Rebar'); setLayer(L, !layerOn[L]); };
function rgb(c){ return 'rgb(' + Math.round(c[0]*255) + ',' + Math.round(c[1]*255) + ',' + Math.round(c[2]*255) + ')'; }

// picking: a tap (not a drag) raycasts the visible instances
function hookPicking(){
  var el = renderer.domElement, down = null, ray = new THREE.Raycaster(), v = new THREE.Vector2();
  el.addEventListener('pointerdown', function(e){ down = [e.clientX, e.clientY, Date.now()]; });
  el.addEventListener('pointerup', function(e){
    if (!down) return; var dx = e.clientX - down[0], dy = e.clientY - down[1];
    if (dx*dx + dy*dy > 64 || Date.now() - down[2] > 600){ down = null; return; }
    down = null;
    var r = el.getBoundingClientRect(); v.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
    ray.setFromCamera(v, camera);
    var objs = []; Object.keys(meshes).forEach(function(L){ if (meshes[L].visible) objs.push(meshes[L]); });
    if (openMesh && openMesh.visible) objs.push(openMesh);
    polyMeshes.forEach(function(mesh){ if (mesh.visible) objs.push(mesh); });
    var hit = ray.intersectObjects(objs, false)[0];
    if (!hit){ clearSel(); return; }
    if (hit.object.userData.openings){ showOpening(hit.instanceId); return; }
    if (hit.object.userData.poly){ var pgi = hit.object.userData.gi; selectWall(U[pgi*5+1], pgi); return; }
    var gi = hit.object.userData.idx[hit.instanceId];
    selectWall(U[gi*5+1], gi);
  });
}
function clearSel(){ selWall = -1; selBlock = -1; paint(); closePanel(); $('card').classList.remove('open'); }

// ── panel helpers ──
function psetMap(obj){ var m = {}; (obj.psets || []).forEach(function(p){ m[p[0]] = p[1]; }); return m; }
function fmt(v){
  if (v === true) return 'Yes'; if (v === false) return 'No'; if (v === null || v === undefined) return '—';
  if (typeof v === 'number') return Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined, { maximumFractionDigits: 3 });
  return esc(v);
}
function kv(props, skip){
  var h = '<dl class="kv">';
  props.forEach(function(p){ if (skip && skip.indexOf(p[0]) >= 0) return; h += '<dt>' + esc(p[0]) + '</dt><dd class="' + (typeof p[1] === 'number' ? 'n' : 't') + '">' + fmt(p[1]) + '</dd>'; });
  return h + '</dl>';
}
function get(props, k){ for (var i = 0; i < props.length; i++) if (props[i][0] === k) return props[i][1]; }
function openPanel(title, sub, body){
  $('pTitle').innerHTML = esc(title) + (sub ? '<span class="sub">' + sub + '</span>' : '');
  $('pBody').innerHTML = body; $('pBody').scrollTop = 0;
  $('panel').classList.add('open'); document.body.classList.add('sheet');
}
function closePanel(){ $('panel').classList.remove('open'); document.body.classList.remove('sheet'); }
$('pClose').onclick = function(){ clearSel(); };

function selectWall(k, gi){
  selWall = k; selBlock = gi; paint();
  var w = meta.walls[k], ps = psetMap(w), html = '';
  var wp = ps['TMM Wall'] || [];
  html += '<section><h3>Wall</h3>' + kv([['IFC name (wall line)', w.name], ['Tag', w.tag], ['Type (ObjectType)', w.objtype]].concat(wp), ['Wall line']) + '</section>';

  var lifts = Object.keys(ps).filter(function(n){ return /^TMM Lift \d+$/.test(n); })
    .sort(function(a, b){ return +a.split(' ')[2] - +b.split(' ')[2]; });
  var geoCount = 0; for (var i = 0; i < N; i++) if (U[i*5+1] === k) geoCount++;
  if (lifts.length){
    var cols = [];
    lifts.forEach(function(n){ ps[n].forEach(function(p){ if (p[0].indexOf('Blocks: ') === 0 && cols.indexOf(p[0]) < 0) cols.push(p[0]); }); });
    cols.sort();
    var sufs = cols.map(function(c){ var d = c.indexOf(' - '); return d > 0 ? c.slice(d + 3) : ''; });
    var common = sufs.every(function(x){ return x && x === sufs[0]; }) ? sufs[0] : '';
    var t = '<div class="tw"><table><thead><tr><th>Lift</th><th>Bottom – top</th>';
    cols.forEach(function(c){
      var s = c.slice(8), d = s.indexOf(' - ');
      t += '<th>' + esc(d > 0 ? s.slice(0, d) : s) + (d > 0 && !common ? '<small>' + esc(s.slice(d + 3)) + '</small>' : '') + '</th>';
    });
    t += '<th>Lift total</th><th>Grout CY</th><th>Mortar bags</th></tr></thead><tbody>';
    var sums = cols.map(function(){ return 0; }), st = 0, sg = 0, sm = 0;
    lifts.forEach(function(n){
      var p = ps[n], tot = (get(p, 'Lift total pieces') != null ? get(p, 'Lift total pieces') : get(p, 'Lift total blocks')) || 0, g = get(p, 'Grout (CY)') || 0, mb = get(p, 'Mortar (bags)') || 0;
      t += '<tr><td>' + n.split(' ')[2] + '</td><td>' + esc(get(p, 'Lift bottom')) + ' – ' + esc(get(p, 'Lift top')) + '</td>';
      cols.forEach(function(c, ci){ var v = get(p, c); sums[ci] += v || 0; t += '<td>' + (v === undefined ? '—' : fmt(v)) + '</td>'; });
      st += tot; sg += g; sm += mb;
      t += '<td><b>' + fmt(tot) + '</b></td><td>' + fmt(g) + '</td><td>' + fmt(mb) + '</td></tr>';
    });
    t += '<tr class="tot"><td>Sum</td><td></td>' + sums.map(function(v){ return '<td>' + fmt(v) + '</td>'; }).join('') +
      '<td>' + fmt(st) + '</td><td>' + fmt(+sg.toFixed(3)) + '</td><td>' + fmt(+sm.toFixed(2)) + '</td></tr></tbody></table></div>';
    html += '<section><h3>Blocks by lift</h3>' + t +
      '<p class="note">' + (common ? 'Every count is “' + esc(common) + '”. ' : '') + 'From the IFC Psets “TMM Lift 1…' + lifts.length + '”. The Sum row is added up here, not stored in the IFC.</p></section>';
    var wt = ps['TMM Wall Totals'], tb = wt ? (get(wt, 'Total pieces (sum of the lifts)') != null ? get(wt, 'Total pieces (sum of the lifts)') : get(wt, 'Total blocks')) : null;
    if (tb !== null && tb !== st)
      html += '<div class="warn">Lift Psets add up to ' + st.toLocaleString() + ' blocks; “TMM Wall Totals” says ' + tb.toLocaleString() + '; the IFC geometry has ' + geoCount.toLocaleString() + ' parts on this wall.</div>';
  } else {
    html += '<section><h3>Blocks by lift</h3><div class="warn">This wall carries no “TMM Lift” Psets in the IFC (and no Grout / Mortar / Rebar Psets). ' +
      'The IFC geometry has ' + geoCount.toLocaleString() + ' block parts on it.</div></section>';
  }
  if (ps['TMM Grout']) html += '<section><h3>Grout</h3>' + kv(ps['TMM Grout']) + '</section>';
  if (ps['TMM Mortar']) html += '<section><h3>Mortar</h3>' + kv(ps['TMM Mortar']) + '</section>';
  if (ps['TMM Wall Totals']) html += '<section><h3>Wall totals</h3>' + kv(ps['TMM Wall Totals']) + '</section>';
  if (ps['TMM Block Counts']) html += '<section><h3>Block counts (IfcElementQuantity)</h3>' + kv(ps['TMM Block Counts']) + '</section>';
  if (ps['TMM Rebar']) html += '<details><summary>Rebar (' + ps['TMM Rebar'].length + ' lines)</summary>' + kv(ps['TMM Rebar']) + '</details>';
  var ops = meta.openings.filter(function(o){ return o.wall === k; });
  if (ops.length) html += '<details><summary>Openings (' + ops.length + ')</summary><dl class="kv">' + ops.map(function(o){
      var p = psetMap(o)['TMM Opening'] || []; return '<dt>' + esc(o.name) + '</dt><dd>' + esc(get(p, 'Width') || '') + ' × ' + esc(get(p, 'Height') || '') + ', sill ' + esc(get(p, 'Sill above wall base') || '') + '</dd>';
    }).join('') + '</dl></details>';
  html += '<p style="margin-top:14px"><button class="btn" id="zWall">Zoom to this wall</button></p>';
  openPanel(w.name, esc(w.tag) + ' · ' + esc(w.objtype), html);
  $('zWall').onclick = function(){ zoomWall(k); };
  if (gi >= 0) showBlock(gi); else $('card').classList.remove('open');
  if (gi >= 0 && phone()) $('pBody').insertAdjacentHTML('afterbegin', '<div id="sheetBlock"><h4>Tapped block: ' + esc(meta.names[U[gi*5+3]]) + '</h4>' + blockKv(gi) + '</div>');
}

function zoomWall(k){
  var b = [1e9,1e9,1e9,-1e9,-1e9,-1e9];
  for (var i = 0; i < N; i++) if (U[i*5+1] === k){
    var x = F[i*7] - ctr[0], y = F[i*7+2] - ctr[2], z = -(F[i*7+1] - ctr[1]);
    if (x < b[0]) b[0] = x; if (y < b[1]) b[1] = y; if (z < b[2]) b[2] = z; if (x > b[3]) b[3] = x; if (y > b[4]) b[4] = y; if (z > b[5]) b[5] = z;
  }
  var c = new THREE.Vector3((b[0]+b[3])/2, (b[1]+b[4])/2, (b[2]+b[5])/2);
  var r = Math.max(b[3]-b[0], b[4]-b[1], b[5]-b[2]) * 0.9 + 2;
  var dir = camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(c); camera.position.copy(c.clone().add(dir.multiplyScalar(r)));
}

function blockProps(gi){
  var pk = U[gi*5+2], out = [];
  if (pk === 65535) return out;
  meta.blockPsetKeys.forEach(function(key, j){ var v = meta.blockPsetCols[j][pk]; if (v !== null && v !== undefined) out.push([key, v]); });
  return out;
}
function phone(){ return window.matchMedia && matchMedia('(max-width:720px)').matches; }
function blockKv(gi){
  var props = blockProps(gi), c = meta.colours[U[gi*5]], h = '<dl class="kv">';
  props.forEach(function(p){
    if (p[0] === 'Wall') return;
    var v = fmt(p[1]);
    if (p[0] === 'Colour') v = '<span class="chip" style="background:' + rgb(c) + '"></span>' + v;
    h += '<dt>' + esc(p[0]) + '</dt><dd>' + v + '</dd>';
  });
  return h + '</dl><p class="note">IFC Pset “TMM Block” · layer ' + esc(meta.layers[U[gi*5+4]]) + '</p>';
}
function showBlock(gi){
  var props = blockProps(gi), c = meta.colours[U[gi*5]];
  var h = '<h4><span>' + esc(meta.names[U[gi*5+3]]) + '</span><button class="x" id="cClose" aria-label="Close">×</button></h4>';
  h += '<dl class="kv">';
  props.forEach(function(p){
    if (p[0] === 'Wall') return;
    var v = fmt(p[1]);
    if (p[0] === 'Colour') v = '<span class="chip" style="background:' + rgb(c) + '"></span>' + v;
    h += '<dt>' + esc(p[0]) + '</dt><dd>' + v + '</dd>';
  });
  h += '</dl><p class="note">IFC Pset “TMM Block” · layer ' + esc(meta.layers[U[gi*5+4]]) + '</p>';
  $('card').innerHTML = h; $('card').classList.add('open');
  $('cClose').onclick = function(){ selBlock = -1; paint(); $('card').classList.remove('open'); };
}
function showOpening(n){
  var o = meta.openings[n], p = psetMap(o)['TMM Opening'] || [];
  var h = '<h4><span>' + esc(o.name) + '</span><button class="x" id="cClose" aria-label="Close">×</button></h4>' + kv(p, ['Wall']) +
    '<p class="note">IfcOpeningElement · Pset “TMM Opening”</p>';
  $('card').innerHTML = h; $('card').classList.add('open');
  $('cClose').onclick = function(){ $('card').classList.remove('open'); };
}

$('bJob').onclick = function(){
  selWall = -1; selBlock = -1; paint(); $('card').classList.remove('open');
  var pr = meta.project, html = '';
  (pr.psets || []).forEach(function(p){ html += '<section><h3>' + esc(p[0]) + '</h3>' + kv(p[1]) + '</section>'; });
  html += '<section><h3>Walls in the IFC</h3><div class="tw"><table><thead><tr><th>Wall</th><th>Type</th><th>Blocks (Wall Totals)</th></tr></thead><tbody>' +
    meta.walls.map(function(w, k){ var wt = psetMap(w)['TMM Wall Totals'] || [];
      return '<tr data-w="' + k + '" style="cursor:pointer"><td>' + esc(w.tag) + '</td><td>' + esc(w.objtype) + '</td><td>' + fmt(get(wt, 'Total pieces (sum of the lifts)') != null ? get(wt, 'Total pieces (sum of the lifts)') : get(wt, 'Total blocks')) + '</td></tr>'; }).join('') +
    '</tbody></table></div><p class="note">Tap a row to open that wall.</p></section>';
  openPanel(pr.name, 'IfcProject · ' + esc(meta.source), html);
  Array.prototype.forEach.call(document.querySelectorAll('#pBody tr[data-w]'), function(tr){
    tr.onclick = function(){ var k = +tr.getAttribute('data-w'); selectWall(k, -1); zoomWall(k); };
  });
};
})();
</script>
</body>
