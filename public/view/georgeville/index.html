<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TMM Field View</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E4DF; --surface:#FBFAF7; --ink:#1F2326; --muted:#5B6165; --line:#D3D0C8;
  --select:#E9B824; --selectInk:#332600;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1E20; --surface:#25282B; --ink:#ECEAE5; --muted:#A4A9AC; --line:#3A3E41;
    --select:#F0C43A; --selectInk:#2A2000; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1E20; --surface:#25282B; --ink:#ECEAE5; --muted:#A4A9AC; --line:#3A3E41;
  --select:#F0C43A; --selectInk:#2A2000; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:Barlow,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--select);outline-offset:2px}

.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.job{min-width:0}
.job h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.4rem;margin:0;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job p{margin:2px 0 0;font-size:.875rem;color:var(--muted)}
.rev{font-weight:600;font-size:.875rem;padding:4px 12px;border:1.5px solid var(--ink);border-radius:999px;white-space:nowrap;flex:none}

.stage{position:relative;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.tools{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;pointer-events:none}
.tools>*{pointer-events:auto}
.tbtn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-weight:500;font-size:.9rem}
.tbtn.small{padding:6px 10px;font-size:.82rem;gap:8px}
.tbtn .box{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-size:12px;line-height:1;flex:none}
.tbtn.small .box{width:15px;height:15px;font-size:10px}
.tbtn[aria-pressed="false"] .box span{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;max-width:100%}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);margin:0;padding:6px 12px;border-radius:999px;
  background:var(--surface);color:var(--muted);font-size:.85rem;white-space:nowrap;border:1px solid var(--line);max-width:calc(100% - 24px);
  overflow:hidden;text-overflow:ellipsis}
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted);margin:0}

.panel{background:var(--surface);border-top:1px solid var(--line);padding:14px 16px 18px;max-height:44vh;overflow:auto;min-width:0;
  -webkit-overflow-scrolling:touch}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips+.chips{margin-bottom:14px}
.chip{font-weight:500;font-size:.9rem;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.panel h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.7rem;margin:0;line-height:1.1;overflow-wrap:anywhere}
.sub{margin:3px 0 0;color:var(--muted)}
dl{margin:12px 0 0;display:grid;grid-template-columns:minmax(0,1fr) auto}
dt,dd{margin:0;padding:10px 0;border-top:1px solid var(--line)}
dt small{display:block;color:var(--muted);font-size:.8rem}
dd{padding-left:12px;font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
dt.tot,dd.tot{border-top:1.5px solid var(--ink)}
.empty{margin:12px 0 0;padding:10px 0;border-top:1px solid var(--line);color:var(--muted)}
.note{margin:14px 0 0;font-size:.8rem;color:var(--muted)}

@media (max-width:520px){
  .legend{font-size:.75rem;padding:5px 8px}
  .tbtn{padding:6px 10px;font-size:.85rem}
}
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr)}
  header{grid-column:1/-1}
  .stage{grid-column:1;grid-row:2}
  .panel{grid-column:2;grid-row:2;max-height:none;border-top:none;border-left:1px solid var(--line);padding:20px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="job">
      <h1 id="job">Loading…</h1>
      <p id="pub">Field view, published Oct 21</p>
    </div>
    <span class="rev" id="rev">Rev 1</span>
  </header>

  <div class="stage" id="stage">
    <div class="tools">
      <button class="tbtn" id="colorBtn" aria-pressed="true"><span class="box"><span>✓</span></span>Color by type</button>
      <button class="tbtn small" id="rebarBtn" aria-pressed="false"><span class="box"><span>✓</span></span>Rebar</button>
      <div class="legend" id="legend"></div>
    </div>
    <p class="status" id="status">Loading the model…</p>
    <p class="hint" id="hint">Drag to turn, pinch or scroll to zoom, tap a wall</p>
  </div>

  <aside class="panel" aria-live="polite">
    <div class="chips" id="chips"></div>
    <div class="chips" id="lifts"></div>
    <div id="detail"></div>
    <p class="note" id="note">This field view shows quantities only. Prices and labor stay in the office.</p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
function b64buf(s){ var b = atob(s.trim()), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; }
window.__field = { ready: false };

Promise.all([
  fetch('meta.json').then(function(r){ return r.json(); }),
  fetch('blocks.b64.txt').then(function(r){ return r.text(); }).then(b64buf),
  fetch('rebar.b64.txt').then(function(r){ return r.text(); }).then(b64buf)
]).then(function(res){ init(res[0], res[1], res[2]); })
  .catch(function(e){ $('status').textContent = 'Could not load the model: ' + e; });

/* ---------- unit types: order + colours ---------- */
var TYPES = [
  { key:'Stretcher',      label:'Stretcher',      col:[0.66,0.67,0.65] },
  { key:'Half',           label:'Half',           col:[0.46,0.62,0.78] },
  { key:'Corner',         label:'Corner',         col:[0.85,0.66,0.26] },
  { key:'Bond beam',      label:'Bond beam',      col:[0.42,0.66,0.40] },
  { key:'Bond beam half', label:'Bond beam half', col:[0.30,0.53,0.33] },
  { key:'Lintel',         label:'Lintel',         col:[0.58,0.47,0.75] },
  { key:'Cut piece',      label:'Cut piece',      col:[0.78,0.42,0.30] }
];
var OTHER = { key:'Other', label:'Other', col:[0.55,0.55,0.55] };
function typeOf(unit){ for (var i = 0; i < TYPES.length; i++) if (TYPES[i].key === unit) return i; return TYPES.length; }
function typeInfo(t){ return TYPES[t] || OTHER; }
function rgbCss(c){ return 'rgb(' + c.map(function(v){ return Math.round(v*255); }).join(',') + ')'; }

function init(meta, bbuf, rbuf){
  var N = meta.nBlocks, F = new Float32Array(bbuf, 0, N*7), U = new Uint16Array(bbuf, N*28, N*5);
  var keys = meta.blockPsetKeys, cols = meta.blockPsetCols;
  var colUnit = cols[keys.indexOf('Unit')], colLift = cols[keys.indexOf('Lift')];
  var colColour = keys.indexOf('Colour') >= 0 ? cols[keys.indexOf('Colour')] : null;

  /* ---------- header ---------- */
  var jobName = (meta.project && meta.project.name) || 'Masonry job';
  $('job').textContent = jobName; document.title = jobName + ' – field view';

  /* ---------- per-block facts ---------- */
  var bLift = new Int16Array(N), bType = new Uint8Array(N), bWall = new Int16Array(N);
  for (var i = 0; i < N; i++){
    var pk = U[i*5+2];
    bLift[i] = pk === 65535 ? 0 : (+colLift[pk] || 0);
    bType[i] = pk === 65535 ? TYPES.length : typeOf(colUnit[pk]);
    bWall[i] = U[i*5+1];
  }

  /* ---------- psets -> plain quantities ---------- */
  function pmap(obj){ var m = {}; (obj.psets || []).forEach(function(p){ m[p[0]] = p[1]; }); return m; }
  function get(props, k){ var v; (props || []).forEach(function(p){ if (p[0] === k) v = p[1]; }); return v; } // last wins (rounded duplicates)
  function find(props, re){ var v, kk; (props || []).forEach(function(p){ if (re.test(p[0])){ v = p[1]; kk = p[0]; } }); return v === undefined ? null : { k: kk, v: v }; }

  var walls = meta.walls.map(function(w, k){
    var ps = pmap(w), wp = ps['TMM Wall'] || [], wt = ps['TMM Wall Totals'] || [];
    var lifts = {};
    Object.keys(ps).forEach(function(name){
      var m = /^TMM Lift (\d+)/.exec(name); if (!m) return;
      var p = ps[name], n = +m[1], q = qtyFrom(p, get(p, 'Lift total pieces'));
      q.lo = get(p, 'Lift bottom'); q.hi = get(p, 'Lift top');
      if (q.total > 0) lifts[n] = q;
    });
    var whole = qtyFrom(wt, get(wt, 'Total pieces (sum of the lifts)'));
    if (whole.grout === null){ var g = find(ps['TMM Grout'], /^Wall grout \((CY|m³)\)$/); if (g){ whole.grout = g.v; whole.groutU = g.k; } }
    var rw = find(wt, /^Rebar \((lbs|kg)/) || find(ps['TMM Rebar'], /^Rebar \((lbs|kg)/);
    var bars = 0;
    (ps['TMM Rebar'] || []).forEach(function(p){ var m = /^(\d+)\s*x\s/.exec(String(p[1])); if (m) bars += +m[1]; });
    whole.rebarW = rw ? rw.v : null; whole.rebarU = rw ? (/kg/.test(rw.k) ? 'kg' : 'lb') : '';
    whole.bars = bars;
    var ops = meta.openings.filter(function(o){ return o.wall === k; }).map(function(o){ return get((pmap(o)['TMM Opening']), 'Type') || 'Opening'; });
    return { k:k, name:w.name, tag:w.tag, type:get(wp, 'Wall type') || w.objtype, len:get(wp, 'Length'), h:get(wp, 'Height (tallest)'),
      bond:get(wp, 'Bond'), grout:get(wp, 'Grout mode'), liftH:get(wp, 'Lift height'), lifts:lifts, whole:whole, ops:ops };
  });

  // a Pset (lift or wall totals) -> {rows:{label:{n, colours}}, total, grout, mortar}
  function qtyFrom(p, total){
    var q = { units:{}, total: total || 0, grout:null, groutU:'', mortar:null };
    (p || []).forEach(function(e){
      if (e[0].indexOf('Blocks: ') === 0){
        var s = e[0].slice(8), d = s.lastIndexOf(' - '), label = d > 0 ? s.slice(0, d) : s, colour = d > 0 ? s.slice(d+3) : '';
        var u = q.units[label] || (q.units[label] = { n:0, colours:{} });
        u.n += e[1] || 0; if (colour) u.colours[colour] = (u.colours[colour] || 0) + (e[1] || 0);
      }
    });
    var g = find(p, /^Grout \((CY|m³)\)$/); if (g){ q.grout = g.v; q.groutU = g.k; }
    var m = get(p, 'Mortar (bags)'); if (m !== undefined) q.mortar = m;
    if (!q.total){ var t = 0; Object.keys(q.units).forEach(function(l){ t += q.units[l].n; }); q.total = t; }
    return q;
  }
  function addQ(a, b){
    if (!b) return a;
    Object.keys(b.units).forEach(function(l){
      var u = a.units[l] || (a.units[l] = { n:0, colours:{} }); u.n += b.units[l].n;
      Object.keys(b.units[l].colours).forEach(function(c){ u.colours[c] = (u.colours[c] || 0) + b.units[l].colours[c]; });
    });
    a.total += b.total;
    if (b.grout !== null){ a.grout = (a.grout || 0) + b.grout; a.groutU = b.groutU; }
    if (b.mortar !== null) a.mortar = (a.mortar || 0) + b.mortar;
    if (b.rebarW != null){ a.rebarW = (a.rebarW || 0) + b.rebarW; a.rebarU = b.rebarU; }
    if (b.bars) a.bars = (a.bars || 0) + b.bars;
    return a;
  }
  function emptyQ(){ return { units:{}, total:0, grout:null, groutU:'', mortar:null, rebarW:null, rebarU:'', bars:0 }; }

  // sizes per pset label ('8" Stretcher' -> '8x8x16'), learned from the drawn blocks
  var sizeOf = {};
  (function(){
    var colSize = keys.indexOf('Size') >= 0 ? cols[keys.indexOf('Size')] : null, seen = {};
    for (var i = 0; i < N; i++){
      var pk = U[i*5+2]; if (pk === 65535 || !colSize) continue;
      var unit = colUnit[pk], nm = meta.names[U[i*5+3]] || '', size = nm.indexOf(unit + ' ') === 0 ? nm.slice(unit.length + 1) : '';
      var m = /\(([\d.]+)\s*x/.exec(colSize[pk] || ''); if (!m || !size) continue;
      var w = +m[1], cand = [Math.round(w + 0.375) + '"', Math.round((w*25.4 + 10)/10) + ' cm'];
      cand.forEach(function(c){ var l = c + ' ' + unit; (seen[l] = seen[l] || {})[size] = 1; });
    }
    Object.keys(seen).forEach(function(l){ var s = Object.keys(seen[l]); if (s.length <= 2) sizeOf[l] = s.join(', '); });
  })();

  // lift numbers that have blocks anywhere
  var liftNums = {};
  walls.forEach(function(w){ Object.keys(w.lifts).forEach(function(n){ liftNums[n] = 1; }); });
  liftNums = Object.keys(liftNums).map(Number).sort(function(a, b){ return a - b; });
  var liftHs = []; walls.forEach(function(w){ if (w.liftH && liftHs.indexOf(w.liftH) < 0) liftHs.push(w.liftH); });
  $('note').textContent = (liftHs.length ? 'Lifts are ' + liftHs.join(' / ') + '. ' : '') + 'This field view shows quantities only. Prices and labor stay in the office.';

  /* ---------- three.js ---------- */
  var stage = $('stage'), canvas = document.createElement('canvas');
  canvas.setAttribute('aria-label', '3D view of the masonry walls. Tap a wall to see its counts.');
  stage.insertBefore(canvas, stage.firstChild);
  var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true, alpha:true, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.localClippingEnabled = true;
  var clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e5);
  var scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a80, 0.8));
  var sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(0.6, 1, 0.4); scene.add(sun);
  var sun2 = new THREE.DirectionalLight(0xffffff, 0.18); sun2.position.set(-0.7, 0.4, -0.5); scene.add(sun2);

  var bb = [1e9,1e9,1e9,-1e9,-1e9,-1e9];
  for (i = 0; i < N; i++) for (var k = 0; k < 3; k++){ var v = F[i*7+k]; if (v < bb[k]) bb[k] = v; if (v > bb[k+3]) bb[k+3] = v; }
  var ctr = [(bb[0]+bb[3])/2, (bb[1]+bb[4])/2, bb[2]];
  var span = Math.max(bb[3]-bb[0], bb[4]-bb[1], 1), tall = bb[5]-bb[2];
  var camera = new THREE.PerspectiveCamera(40, 1, 0.05, span * 30);

  // top of each block in scene units, so the clip sits at a lift's top
  var bTop = new Float32Array(N);
  for (i = 0; i < N; i++) bTop[i] = F[i*7+2] - ctr[2] + F[i*7+5]/2;
  var floorY = -(ctr[2] - 0) ; // IFC z = 0

  var polySet = {}; (meta.polys || []).forEach(function(pp){ polySet[pp.i] = 1; });
  var jit = new Float32Array(N);
  for (i = 0; i < N; i++) jit[i] = 1 + (((i * 2654435761) >>> 0) % 1000 / 1000 - 0.5) * 0.07;

  // one InstancedMesh per IFC layer, instances sorted by lift so a lift view = a shorter draw count
  var geo = new THREE.BoxGeometry(1, 1, 1), meshes = [];
  var groups = {};
  for (i = 0; i < N; i++){ if (polySet[i]) continue; var L = U[i*5+4]; (groups[L] = groups[L] || []).push(i); }
  var m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  Object.keys(groups).forEach(function(L){
    var idx = groups[L].sort(function(a, b){ return bLift[a] - bLift[b] || a - b; });
    var mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color:0xffffff }), idx.length);
    for (var n = 0; n < idx.length; n++){
      var b = idx[n]*7;
      p.set(F[b] - ctr[0], F[b+2] - ctr[2], -(F[b+1] - ctr[1])); q.setFromAxisAngle(up, F[b+6]); s.set(F[b+3], F[b+5], F[b+4]);
      m4.compose(p, q, s); mesh.setMatrixAt(n, m4);
    }
    mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(idx.length*3), 3);
    mesh.userData = { idx: idx };
    meshes.push(mesh); scene.add(mesh);
  });
  // clipped pieces (rake / gable): their own extruded face polygon
  var toThree = new THREE.Matrix4().set(1,0,0,-ctr[0], 0,0,1,-ctr[2], 0,-1,0,ctr[1], 0,0,0,1), polys = [];
  (meta.polys || []).forEach(function(pp){
    var shape = new THREE.Shape(pp.pts.map(function(v){ return new THREE.Vector2(v[0], v[1]); }));
    var g = new THREE.ExtrudeGeometry(shape, { depth:pp.d, bevelEnabled:false, steps:1 });
    var m = pp.m, M = new THREE.Matrix4().set(m[0],m[1],m[2],m[3], m[4],m[5],m[6],m[7], m[8],m[9],m[10],m[11], 0,0,0,1);
    var mesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color:0xffffff }));
    mesh.matrixAutoUpdate = false; mesh.matrix.multiplyMatrices(toThree, M); mesh.userData = { gi: pp.i };
    polys.push(mesh); scene.add(mesh);
  });
  // openings: translucent boxes, clipped with the lift
  var openMesh = null;
  if (meta.openings.length){
    openMesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color:0xffffff, transparent:true, opacity:0.3, depthWrite:false, clippingPlanes:[clipPlane] }), meta.openings.length);
    meta.openings.forEach(function(o, n){
      p.set(o.c[0] - ctr[0], o.c[2] - ctr[2], -(o.c[1] - ctr[1])); q.setFromAxisAngle(up, o.r); s.set(o.s[0], o.s[2], o.s[1]);
      m4.compose(p, q, s); openMesh.setMatrixAt(n, m4); openMesh.setColorAt(n, new THREE.Color(0.43, 0.6, 0.72));
    });
    openMesh.renderOrder = 2; scene.add(openMesh);
  }
  // rebar: bar axes as lines, off by default
  var rebar = null;
  if (meta.nRebarSegs){
    var segs = meta.nRebarSegs, rp = new Float32Array(rbuf, 0, segs*6), pos = new Float32Array(segs*6);
    for (i = 0; i < segs*2; i++){ pos[i*3] = rp[i*3] - ctr[0]; pos[i*3+1] = rp[i*3+2] - ctr[2]; pos[i*3+2] = -(rp[i*3+1] - ctr[1]); }
    var rg = new THREE.BufferGeometry(); rg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    rebar = new THREE.LineSegments(rg, new THREE.LineBasicMaterial({ color:0xb03a2e, depthTest:false, transparent:true, opacity:0.9, clippingPlanes:[clipPlane] }));
    rebar.renderOrder = 3; rebar.visible = false; scene.add(rebar);
  } else $('rebarBtn').hidden = true;

  var grid = new THREE.GridHelper(Math.ceil(span*1.5/3.048)*3.048, Math.ceil(span*1.5/3.048), 0x999999, 0x999999);
  grid.material.transparent = true; grid.material.opacity = 0.5; grid.position.y = floorY - 0.003; scene.add(grid);
  function dark(){ var a = document.documentElement.getAttribute('data-theme'); return a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function themeScene(){ grid.material.color.set(dark() ? 0x4a4e51 : 0xb9b6ae); paint(); }

  /* ---------- camera orbit (drag turn, pinch / wheel zoom, right-drag or two-finger pan) ---------- */
  var target = new THREE.Vector3(0, tall*0.3, 0), theta = 0.75, phi = 1.05, radius = span*1.25, R0 = radius;
  var clamp = function(v, a, b){ return Math.min(b, Math.max(a, v)); };
  function updateCam(){
    camera.position.set(target.x + radius*Math.sin(phi)*Math.sin(theta), target.y + radius*Math.cos(phi), target.z + radius*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(target);
  }
  var pending = false;
  function schedule(){ if (!pending){ pending = true; requestAnimationFrame(function(){ pending = false; renderer.render(scene, camera); }); } }
  function resize(){
    var w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w/h; camera.fov = w < 520 ? 52 : 40; camera.updateProjectionMatrix(); updateCam(); schedule();
  }
  new ResizeObserver(resize).observe(stage);

  var pointers = new Map(), moved = 0, pinch0 = 0, rad0 = radius, mid0 = null, panBtn = false;
  function hideHint(){ $('hint').hidden = true; }
  function two(){ var a = Array.from(pointers.values()); return { d: Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y), x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 }; }
  function pan(dx, dy){
    var k = radius * 2 * Math.tan(camera.fov*Math.PI/360) / stage.clientHeight;
    var right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0), upv = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    target.addScaledVector(right, -dx*k).addScaledVector(upv, dy*k);
  }
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  canvas.addEventListener('pointerdown', function(e){
    canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pointers.size === 1){ moved = 0; panBtn = e.button === 2 || e.shiftKey; }
    if (pointers.size === 2){ var t = two(); pinch0 = t.d; rad0 = radius; mid0 = t; moved = 99; }
  });
  canvas.addEventListener('pointermove', function(e){
    if (!pointers.has(e.pointerId)) return;
    var prev = pointers.get(e.pointerId), cur = { x:e.clientX, y:e.clientY }; pointers.set(e.pointerId, cur);
    if (pointers.size === 1){
      var dx = cur.x - prev.x, dy = cur.y - prev.y; moved += Math.abs(dx) + Math.abs(dy); if (moved < 6) return;
      if (panBtn) pan(dx, dy); else { theta -= dx*0.008; phi = clamp(phi - dy*0.008, 0.15, 1.5); }
    } else if (pointers.size === 2 && pinch0){
      var t = two(); radius = clamp(rad0*pinch0/t.d, R0*0.08, R0*3); pan(t.x - mid0.x, t.y - mid0.y); mid0 = t;
    }
    hideHint(); updateCam(); schedule();
  });
  function endPointer(e, tap){
    if (tap && pointers.size === 1 && moved < 6 && !panBtn) pick(e);
    pointers.delete(e.pointerId); if (pointers.size < 2) pinch0 = 0;
  }
  canvas.addEventListener('pointerup', function(e){ endPointer(e, true); });
  canvas.addEventListener('pointercancel', function(e){ endPointer(e, false); });
  canvas.addEventListener('wheel', function(e){ e.preventDefault(); radius = clamp(radius*(1 + e.deltaY*0.001), R0*0.08, R0*3); hideHint(); updateCam(); schedule(); }, { passive:false });

  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(e){
    var r = canvas.getBoundingClientRect();
    ndc.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1); ray.setFromCamera(ndc, camera);
    var objs = meshes.concat(polys.filter(function(m){ return m.visible; }));
    var hit = ray.intersectObjects(objs, false)[0]; hideHint();
    if (!hit) { select(null); return; }
    var gi = hit.object.userData.gi !== undefined ? hit.object.userData.gi : hit.object.userData.idx[hit.instanceId];
    select(bWall[gi]);
  }

  /* ---------- state + painting ---------- */
  var selected = null, selLift = null, colorOn = true;
  var NEUTRAL = [0.84, 0.83, 0.8];
  function blockColour(i, out){
    var c = colorOn ? typeInfo(bType[i]).col : NEUTRAL, j = jit[i], r = c[0]*j, g = c[1]*j, b = c[2]*j;
    if (selLift !== null && bLift[i] === selLift){ r = r*0.5 + sel.r*0.5; g = g*0.5 + sel.g*0.5; b = b*0.5 + sel.b*0.5; }
    if (selected !== null && bWall[i] !== selected){
      var f = dark() ? [0.22, 0.23, 0.24] : [0.93, 0.925, 0.91]; r = r*0.15 + f[0]*0.85; g = g*0.15 + f[1]*0.85; b = b*0.15 + f[2]*0.85;
    }
    out[0] = Math.min(1, r); out[1] = Math.min(1, g); out[2] = Math.min(1, b);
  }
  var tmp = [0, 0, 0], sel = new THREE.Color();
  function paint(){
    sel.set(getComputedStyle(document.documentElement).getPropertyValue('--select').trim() || '#E9B824');
    meshes.forEach(function(mesh){
      var idx = mesh.userData.idx, a = mesh.instanceColor.array, cnt = 0;
      for (var n = 0; n < idx.length; n++){
        var i = idx[n]; blockColour(i, tmp); a[n*3] = tmp[0]; a[n*3+1] = tmp[1]; a[n*3+2] = tmp[2];
        if (selLift === null || bLift[i] <= selLift) cnt = n + 1;
      }
      mesh.count = cnt; mesh.instanceColor.needsUpdate = true;
    });
    polys.forEach(function(mesh){
      var i = mesh.userData.gi; blockColour(i, tmp); mesh.material.color.setRGB(tmp[0], tmp[1], tmp[2]);
      mesh.visible = selLift === null || bLift[i] <= selLift;
    });
    // clip openings + rebar at the top of the highest block shown
    if (selLift === null) clipPlane.constant = 1e5;
    else { var top = -1e9; for (var i = 0; i < N; i++) if (bLift[i] <= selLift && bTop[i] > top) top = bTop[i]; clipPlane.constant = top + 0.005; }
    legend();
    schedule();
  }
  var present = {}; for (i = 0; i < N; i++) present[bType[i]] = 1;
  function legend(){
    var el = $('legend'); el.hidden = !colorOn;
    el.innerHTML = Object.keys(present).map(Number).sort(function(a, b){ return a - b; }).map(function(t){
      var ti = typeInfo(t); return '<span><i style="background:' + rgbCss(ti.col) + '"></i>' + esc(ti.label) + '</span>';
    }).join('');
  }

  /* ---------- panel ---------- */
  var fmt = function(n){ return Math.round(n).toLocaleString('en-US'); };
  function groutText(q){
    if (q.grout === null) return null;
    return /m³/.test(q.groutU) ? q.grout.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' m³'
      : q.grout.toLocaleString('en-US', { minimumFractionDigits:1, maximumFractionDigits:1 }) + ' cu yd';
  }
  function labelOrder(a, b){
    var ta = typeOf(a.replace(/^\S+(\s+cm)?\s+/, '')), tb = typeOf(b.replace(/^\S+(\s+cm)?\s+/, ''));
    return ta - tb || parseFloat(a) - parseFloat(b) || (a < b ? -1 : 1);
  }
  function rows(q, withRebar){
    var h = '<dl>';
    Object.keys(q.units).filter(function(l){ return q.units[l].n > 0; }).sort(labelOrder).forEach(function(l){
      var u = q.units[l], extra = [];
      if (sizeOf[l]) extra.push(esc(sizeOf[l]));
      Object.keys(u.colours).forEach(function(c){ extra.push(fmt(u.colours[c]) + ' ' + esc(c)); });
      h += '<dt>' + esc(l) + (extra.length ? '<small>' + extra.join(' · ') + '</small>' : '') + '</dt><dd>' + fmt(u.n) + '</dd>';
    });
    h += '<dt class="tot">Total blocks</dt><dd class="tot">' + fmt(q.total) + '</dd>';
    var g = groutText(q); if (g) h += '<dt>Grout</dt><dd>' + g + '</dd>';
    if (q.mortar !== null) h += '<dt>Mortar</dt><dd>' + fmt(Math.ceil(q.mortar - 1e-9)) + ' bags</dd>';
    if (withRebar && (q.bars || q.rebarW)){
      h += '<dt>Rebar<small>bars on the bar list</small></dt><dd>' + (q.bars ? fmt(q.bars) + ' bars' : '') + (q.rebarW ? (q.bars ? ', ' : '') + fmt(q.rebarW) + ' ' + q.rebarU : '') + '</dd>';
    }
    return h + '</dl>';
  }
  function plural(n, word){ return n + ' ' + word + (n === 1 ? '' : 's'); }
  function describe(w){
    var bits = [w.type];
    if (w.len) bits.push(w.len + ' long'); if (w.h) bits.push(w.h + ' tall');
    var t = bits.join(', ');
    var more = [];
    if (w.bond) more.push(w.bond.toLowerCase()); if (w.grout) more.push(w.grout.toLowerCase() + ' grout');
    var c = {}; w.ops.forEach(function(o){ c[o] = (c[o] || 0) + 1; });
    var names = { 'Overhead':'overhead door', 'Door':'door', 'Window':'window' };
    Object.keys(c).forEach(function(o){ more.push(plural(c[o], names[o] || o.toLowerCase())); });
    return t + (more.length ? '. ' + more.join(', ').replace(/^./, function(x){ return x.toUpperCase(); }) : '');
  }
  function liftRange(ws){
    var r = null, same = true;
    ws.forEach(function(w){ var l = w.lifts[selLift]; if (!l) return; var t = l.lo + ' to ' + l.hi; if (r === null) r = t; else if (r !== t) same = false; });
    return 'Lift ' + selLift + (r && same ? ', ' + r : '') + '. ';
  }
  function renderPanel(){
    var h;
    if (selected !== null){
      var w = walls[selected], q = selLift === null ? w.whole : w.lifts[selLift];
      h = '<h2>' + esc(w.name) + '</h2><p class="sub">' + esc(describe(w)) + '</p>';
      if (selLift !== null) h += '<p class="sub">' + esc(liftRange([w])) + '</p>';
      h += q ? rows(q, selLift === null) : '<p class="empty">No blocks in lift ' + selLift + ' on this wall.</p>';
    } else {
      var tot = emptyQ();
      walls.forEach(function(w){ addQ(tot, selLift === null ? w.whole : w.lifts[selLift]); });
      var nb = 0; walls.forEach(function(w){ nb += (selLift === null ? w.whole.total : (w.lifts[selLift] ? w.lifts[selLift].total : 0)); });
      h = '<h2>Whole job</h2><p class="sub">' + (selLift !== null ? esc(liftRange(walls)) : '') + plural(walls.length, 'wall') + ', ' + fmt(nb) + ' blocks</p>' + rows(tot, selLift === null);
    }
    $('detail').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('#chips .chip'), function(b){ b.setAttribute('aria-pressed', String((b.dataset.w === '' ? null : +b.dataset.w) === selected)); });
    Array.prototype.forEach.call(document.querySelectorAll('#lifts .chip'), function(b){ b.setAttribute('aria-pressed', String((b.dataset.l === '' ? null : +b.dataset.l) === selLift)); });
  }
  function select(k){ selected = k; paint(); renderPanel(); hash(); }
  function setLift(n){ selLift = n; paint(); renderPanel(); hash(); }
  function hash(){
    var parts = []; if (selected !== null) parts.push('wall=' + encodeURIComponent(walls[selected].tag)); if (selLift !== null) parts.push('lift=' + selLift);
    try { history.replaceState(null, '', parts.length ? '#' + parts.join('&') : location.pathname + location.search); } catch(e) {}
  }

  $('chips').innerHTML = '<button class="chip" data-w="" aria-pressed="true">Whole job</button>' +
    walls.map(function(w){ return '<button class="chip" data-w="' + w.k + '" aria-pressed="false" title="' + esc(w.tag) + '">' + esc(w.name) + '</button>'; }).join('');
  $('chips').addEventListener('click', function(e){ var b = e.target.closest('.chip'); if (b) select(b.dataset.w === '' ? null : +b.dataset.w); });
  $('lifts').innerHTML = '<button class="chip" data-l="" aria-pressed="true">All lifts</button>' +
    liftNums.map(function(n){ return '<button class="chip" data-l="' + n + '" aria-pressed="false">Lift ' + n + '</button>'; }).join('');
  $('lifts').addEventListener('click', function(e){ var b = e.target.closest('.chip'); if (b) setLift(b.dataset.l === '' ? null : +b.dataset.l); });
  $('colorBtn').addEventListener('click', function(){ colorOn = !colorOn; this.setAttribute('aria-pressed', String(colorOn)); paint(); });
  $('rebarBtn').addEventListener('click', function(){ if (!rebar) return; rebar.visible = !rebar.visible; this.setAttribute('aria-pressed', String(rebar.visible)); schedule(); });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeScene);

  // deterministic start: #wall=<tag or name>&lift=<n>&rebar=1
  var hp = {}; location.hash.replace(/^#/, '').split('&').forEach(function(kv){ var a = kv.split('='); if (a[0]) hp[a[0]] = decodeURIComponent(a[1] || ''); });
  if (hp.wall){ walls.forEach(function(w){ if (w.tag === hp.wall || w.name === hp.wall || String(w.k) === hp.wall) selected = w.k; }); }
  if (hp.lift && liftNums.indexOf(+hp.lift) >= 0) selLift = +hp.lift;
  if (hp.rebar === '1' && rebar){ rebar.visible = true; $('rebarBtn').setAttribute('aria-pressed', 'true'); }

  $('status').hidden = true;
  themeScene(); resize(); renderPanel();
  window.__field = { ready:true, blocks:N, walls:walls.length, lifts:liftNums.slice(), select:select, setLift:setLift,
    shown:function(){ var c = 0; meshes.forEach(function(m){ c += m.count; }); polys.forEach(function(m){ if (m.visible) c++; }); return c; } };
}
})();
</script>
</body>
</html>
